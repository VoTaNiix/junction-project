<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skillink, Espoo pre-event matchmaking</title>
    <meta name="description" content="Less Résumé. Less Pitch Deck. More Real You. Skillink connects talent, researchers and innovators with companies through real-world challenges, for City of Espoo and Business Espoo recruitment and matchmaking events." />
    <meta name="theme-color" content="#003580" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23003580'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Header and footer texts are set by js/app.js (paintChrome) in the chosen language. -->
    <a class="skip-link" href="#main" id="skip-link">Skip to content</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="wordmark" href="#/participant/board" aria-label="Skillink home" id="home-link">
          <span class="wordmark__name">Skillink<span aria-hidden="true"></span></span>
          <span class="wordmark__tag">Less Résumé. Less Pitch Deck. More Real You.</span>
        </a>
        <div class="topbar__actions">
          <a class="btn btn--sm btn--reset" href="#/guide/start" id="guide-link">Guide</a>
          <button type="button" class="btn btn--sm btn--reset" id="reset-demo">Reset demo data</button>
          <label class="langpick">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span class="sr-only" id="lang-label">Language</span>
            <select id="ui-lang" aria-labelledby="lang-label">
              <option value="en" lang="en">English</option>
              <option value="fi" lang="fi">Suomi</option>
              <option value="sv" lang="sv">Svenska</option>
            </select>
          </label>
          <!-- Sign in button, or the signed-in account with its menu (js/app.js, paintAccount) -->
          <div class="account" id="account"></div>
        </div>
      </div>
    </header>

    <div class="contextbar">
      <div class="contextbar__inner" id="contextbar"></div>
    </div>

    <main id="main" tabindex="-1"></main>

    <footer class="site">
      <span id="footer-event"></span>
      <span id="footer-note">Prototype. No algorithm ranks, scores or filters people or teams. Demo data stays on this computer.</span>
    </footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
