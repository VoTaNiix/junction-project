<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skillink, Espoo pre-event matchmaking</title>
    <meta name="description" content="Less Résumé. Less Pitch Deck. More Real You. Skillink connects talent, researchers and innovators with companies through real-world challenges, for City of Espoo and Business Espoo recruitment and matchmaking events." />
    <meta name="theme-color" content="#f7f6f2" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="wordmark" href="#/participant/board" aria-label="Skillink home">
          <span class="wordmark__mark" aria-hidden="true"><span></span><span></span></span>
          <span class="wordmark__name">Skillink<span aria-hidden="true">.</span></span>
          <span class="wordmark__tag">Less Résumé. Less Pitch Deck. More Real You.</span>
        </a>
        <nav class="roles" id="roles" aria-label="Switch side">
          <a href="#/participant/board" data-role="participant" title="Talent, researchers and project partners who show their thinking">Talent</a>
          <a href="#/host/feed" data-role="host" title="Companies that post a challenge and read people's thinking">Employer</a>
        </nav>
        <div class="topbar__actions">
          <a class="btn btn--sm btn--reset" href="#/organizer/queue" id="organizer-link">Event team</a>
          <a class="btn btn--sm btn--reset" href="#/guide/start" id="guide-link">Guide</a>
          <button type="button" class="btn btn--sm btn--reset" id="reset-demo">Reset demo data</button>
        </div>
      </div>
    </header>

    <div class="contextbar">
      <div class="contextbar__inner" id="contextbar"></div>
    </div>

    <main id="main" tabindex="-1"></main>

    <footer class="site">
      <a class="wordmark" href="#/participant/board" aria-label="Skillink home">
        <span class="wordmark__mark" aria-hidden="true"><span></span><span></span></span>
        <span class="wordmark__name">Skillink<span aria-hidden="true">.</span></span>
      </a>
      <span id="footer-event"></span>
      <span>Prototype. No algorithm ranks, scores or filters people or teams. Demo data stays on this computer.</span>
    </footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
