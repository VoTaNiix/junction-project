<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skillink, Espoo pre-event matchmaking</title>
    <meta name="description" content="Less Résumé. More Real You. Recruitment that starts with a real conversation about a real problem, for City of Espoo events." />
    <meta name="theme-color" content="#003580" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23003580'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="wordmark" href="#/participant/board" aria-label="Skillink home">
          <span class="wordmark__name">Skillink<span aria-hidden="true"></span></span>
          <span class="wordmark__tag">Less Résumé. More Real You.</span>
        </a>
        <nav class="roles" id="roles" aria-label="Switch perspective">
          <a href="#/participant/board" data-role="participant">Participant</a>
          <a href="#/recruiter/feed" data-role="recruiter">Company recruiter</a>
          <a href="#/organizer/queue" data-role="organizer">Espoo organizer</a>
          <a href="#/privacy/annex" data-role="privacy">Privacy &amp; AI Act</a>
        </nav>
        <div class="topbar__actions">
          <a class="btn btn--sm btn--reset" href="#/guide/start" id="guide-link">Guide</a>
          <button type="button" class="btn btn--sm btn--reset" id="reset-demo">Reset demo data</button>
        </div>
      </div>
    </header>

    <div class="contextbar">
      <div class="contextbar__inner" id="contextbar"></div>
    </div>

    <main id="main" tabindex="-1"></main>

    <footer class="site">
      <span id="footer-event"></span>
      <span>Prototype. No algorithm ranks, scores or filters people. Data stays in this browser.</span>
    </footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
